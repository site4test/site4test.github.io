<!doctype html>
<html lang="ro" data-theme="aur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pagina nu există — Golden Lotus</title>
<link rel="icon" href="lotus.svg" type="image/svg+xml">
<link rel="preload" href="fonts/woff2/Ysabeau-var.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // aceeași temă ca pe pagina principală (Aur / Argint), aplicată înainte de prima desenare
  try { var t = localStorage.getItem('gl-theme'); if (t === 'argint' || t === 'aur') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
@font-face { font-family: "Ysabeau"; src: url("fonts/woff2/Ysabeau-var.woff2") format("woff2"); font-weight: 1 1000; font-display: swap; }
@font-face { font-family: "Ysabeau Office"; src: url("fonts/woff2/YsabeauOffice-var.woff2") format("woff2"); font-weight: 1 1000; font-display: swap; }
@font-face { font-family: "Forum"; src: url("fonts/woff2/Forum-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }

:root {
  --porcelain:#F7F6F2; --ink:#0C0B0A; --stone:#65615B; --hairline:#D5D1C8; --gold-text:#7A5310;
  --night:#0C0C0D; --moon:#EEEDEA; --stone-night:#A29F99; --hairline-night:#34363A; --silver-300:#C9CDD3;
  --ease-bloom: cubic-bezier(.16,1,.3,1); --ease-draw: cubic-bezier(.65,0,.35,1); --ease-soft: cubic-bezier(.4,0,.2,1); --ease-press: cubic-bezier(.3,1.4,.5,1);
  --f-display: "Ysabeau", "Segoe UI", sans-serif; --f-text: "Ysabeau Office", "Segoe UI", sans-serif; --f-inscr: "Forum", Georgia, serif;
  --gutter: clamp(20px, 5vw, 72px);
}
:root, [data-theme="aur"] { --bg:var(--porcelain); --fg:var(--ink); --fg-muted:var(--stone); --line:var(--hairline); --metal-text:var(--gold-text);
  --btn-bg:var(--ink); --btn-fg:var(--porcelain); --lotus-paint:var(--ink); color-scheme: light; }
[data-theme="argint"] { --bg:var(--night); --fg:var(--moon); --fg-muted:var(--stone-night); --line:var(--hairline-night); --metal-text:var(--silver-300);
  --btn-bg:var(--moon); --btn-fg:var(--night); --lotus-paint:var(--moon); color-scheme: dark; }

*,*::before,*::after { box-sizing: border-box; }
html { background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: auto 1fr; font: 400 1.0625rem/1.6 var(--f-text); background: var(--bg); color: var(--fg); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 2px; }

.hdr { display: flex; align-items: center; height: 68px; padding-inline: var(--gutter); }
.brand { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; }
.brand svg { width: 34px; height: auto; overflow: visible; }
.brand .ln { stroke-width: 20; }
.brand span { font: 400 .8rem/1 var(--f-inscr); letter-spacing: .34em; padding-top: 2px; }

main { display: grid; place-items: center; text-align: center; padding: 24px var(--gutter) 64px; }
.box { display: grid; justify-items: center; gap: clamp(14px, 2.4vh, 22px); max-width: 40rem; }
.mark { width: min(260px, 62vw); height: auto; overflow: visible; }
.ln { fill: none; stroke: var(--lotus-paint); stroke-linecap: round; stroke-linejoin: miter; stroke-miterlimit: 12; }
.mark .ln { stroke-width: 11; }
.mark .ln path { stroke-dasharray: 1 1.1; stroke-dashoffset: 1.001; animation: draw 1100ms var(--ease-draw) forwards; animation-delay: calc(200ms + var(--o) * 150ms); }
.mark .dot { fill: var(--lotus-paint); transform-box: fill-box; transform-origin: center; transform: scale(0); animation: dot 600ms var(--ease-bloom) forwards; animation-delay: 1450ms; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes dot { to { transform: scale(1); } }
.label { margin: 8px 0 0; font: 400 .75rem/1.3 var(--f-inscr); letter-spacing: .32em; text-transform: uppercase; color: var(--metal-text); }
h1 { margin: 0; font: 200 clamp(2.3rem, 1rem + 4.2vw, 4.6rem)/1.04 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
h1 em { font-style: italic; font-weight: inherit; }
.sub { margin: 0; max-width: 38ch; color: var(--fg-muted); text-wrap: balance; }
.cta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 28px; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.7em; border-radius: 999px; border: 1px solid var(--btn-bg);
  background: var(--btn-bg); color: var(--btn-fg); font: 540 .95rem/1 var(--f-text); letter-spacing: .02em; text-decoration: none; transition: transform 400ms var(--ease-press); }
.pill:active { transform: scale(.97); }
.link-arrow { display: inline-flex; align-items: center; gap: .55em; min-height: 44px; font: 520 .95rem/1 var(--f-text); text-decoration: none; }
.link-arrow span { transition: transform 320ms var(--ease-bloom); }
.link-arrow:hover span { transform: translateX(6px); }
.up { animation: up 900ms var(--ease-bloom) both; animation-delay: var(--d, 500ms); }
@keyframes up { from { opacity: .001; transform: translateY(12px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
}
</style>
</head>
